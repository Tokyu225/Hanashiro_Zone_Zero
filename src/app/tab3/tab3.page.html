<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Form Input
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-input label="Nama" placeholder="Isikan nama"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="NIM" placeholder="Isikan NIM"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Kelas" placeholder="Isikan Kelas"></ion-input>
      </ion-item>
      <br>
      <ion-button>Simpan</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>

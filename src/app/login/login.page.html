<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-bg-grid"></div>
  <div class="auth-glow"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/Derak.png" alt="Hanashiro Zone Zero" />
      </div>

      <h1 class="auth-title">
        HANASHIRO
        <span>ZONE ZERO</span>
      </h1>
      <p class="auth-subtitle">Sign in to continue</p>

      @if (successMessage) {
        <div class="auth-alert success">
          {{ successMessage }}
        </div>
      }
      @if (errorMessage) {
        <div class="auth-alert error">
          {{ errorMessage }}
        </div>
      }

      <form
        class="auth-form"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        novalidate
      >
        <ion-input
          class="auth-field"
          fill="outline"
          label="Email"
          labelPlacement="stacked"
          type="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="off"
          spellcheck="false"
          placeholder="you@example.com"
          formControlName="email"
        ></ion-input>
        @if (submitted && email.invalid) {
          <ion-note class="auth-error">
            Enter a valid email address.
          </ion-note>
        }

        <ion-input
          class="auth-field"
          fill="outline"
          label="Password"
          labelPlacement="stacked"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="Your password"
          formControlName="password"
        >
          <ion-button
            slot="end"
            class="password-toggle"
            fill="clear"
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            (click)="togglePassword()"
          >
            <ion-icon
              slot="icon-only"
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </ion-input>
        @if (submitted && password.invalid) {
          <ion-note class="auth-error">
            Password is required.
          </ion-note>
        }

        <ion-button
          class="auth-submit"
          type="submit"
          expand="block"
          [disabled]="submitting"
        >
          SIGN IN
        </ion-button>
      </form>

      <p class="auth-footer">
        New here? <a routerLink="/register">Create an account</a>
      </p>
    </div>
  </div>
</ion-content>
